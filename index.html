<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8faf9">
  <title>Peta Interaktif Teluk Ratai</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="gaya.css?v=kontrol-layer">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="katalog.js?v=layer-ringkas"></script>
  <script defer src="peta.js?v=layer-ringkas"></script>
</head>
<body>
  <header>
    <h1>Teluk Ratai</h1>
  </header>
  <main>
    <aside>
      <div class="picker">
        <label for="pilihan">Pilih peta</label>
        <select id="pilihan"></select>
        <p id="catatan" hidden></p>
      </div>
      <div class="section-title">
        <h2>Layer <span id="jumlah" aria-label="Jumlah layer aktif"></span></h2>
        <div class="layer-actions">
          <button id="sembunyikan" type="button">Sembunyikan semua</button>
          <button id="pulihkan" type="button">Pulihkan</button>
        </div>
      </div>
      <div id="layer"></div>
      <details>
        <summary>Metadata peta</summary>
        <div id="metadata"></div>
      </details>
    </aside>
    <section class="viewer" aria-label="Penampil peta">
      <div class="map-bar">
        <h2 id="judul-peta"></h2>
        <button type="button" id="cakupan" title="Sesuaikan zoom agar seluruh area peta terpilih terlihat">Lihat seluruh area</button>
      </div>
      <div class="map-frame">
        <div id="peta" role="region" aria-label="Peta Teluk Ratai"></div>
        <p id="status" role="status"></p>
      </div>
    </section>
  </main>
</body>
</html>
