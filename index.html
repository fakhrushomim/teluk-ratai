<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peta Interaktif Teluk Ratai</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="gaya.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="katalog.js"></script>
  <script defer src="peta.js"></script>
</head>
<body>
  <header>
    <h1>Peta Interaktif Teluk Ratai</h1>
    <a href="metadata.json" download>Unduh metadata JSON</a>
  </header>
  <main>
    <aside>
      <label for="pilihan">Pilih peta</label>
      <select id="pilihan"></select>
      <div class="section-title">
        <h2>Layer</h2>
        <button id="pulihkan" type="button">Pulihkan layer</button>
      </div>
      <div id="layer"></div>
      <details>
        <summary>Metadata peta</summary>
        <div id="metadata"></div>
      </details>
    </aside>
    <section class="viewer" aria-label="Penampil peta">
      <div id="peta" role="region" aria-label="Peta Teluk Ratai"></div>
      <button type="button" id="cakupan">Cakupan awal</button>
      <p id="status" role="status"></p>
    </section>
  </main>
</body>
</html>
